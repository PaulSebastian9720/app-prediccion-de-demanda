[project]
name = "ventas-forecast-notebooks"
version = "0.1.0"
description = "Entorno de desarrollo para Jupyter Notebooks de forecasting"
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.1.1",
    "notebook>=7.3.2",
    "nbstripout>=0.9.1",
    "pandas>=2.2.3",
    "xgboost>=2.1.2",
    "scikit-learn==1.8.*",
    "matplotlib>=3.9.0",
    "shap>=0.45.1",
    "openpyxl>=3.1.5",
    "lxml>=5.3.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.7.4",
]
