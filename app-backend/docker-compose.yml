services:
  db:
    image: postgres:17-alpine
    container_name: ventas-forecast-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ventas_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ventas_password}
      POSTGRES_DB: ${POSTGRES_DB:-ventas_forecast}
    ports:
      - "5434:5432"
    volumes:
      - ventas_forecast_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ventas_user} -d ${POSTGRES_DB:-ventas_forecast}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ventas-forecast-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ventas-forecast-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ventas_user}:${POSTGRES_PASSWORD:-ventas_password}@db:5432/${POSTGRES_DB:-ventas_forecast}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - ventas-forecast-network

volumes:
  ventas_forecast_pgdata:
    driver: local

networks:
  ventas-forecast-network:
    driver: bridge
